name: Test

on:
  push:
    branches:
      - master
      - hacs-submission
  pull_request:
    branches:
      - master

jobs:
  pytest:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Syntax check
        run: |
          node --check shopping-list-card.js
          python -m py_compile apps/einkaufsliste_backend.py
